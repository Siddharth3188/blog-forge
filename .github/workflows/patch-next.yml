
name: Patch Next.js security version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-next:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Next.js and lockfile
        run: npm install next@15.5.28 --save-exact

      - name: Commit updated dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "fix: patch Next.js security vulnerability"
            git push
          else
            echo "No dependency changes to commit."
          fi
